<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <rect width="70" height="70" rx="10" fill="#017e84"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
    <!-- Bar chart bars -->
    <rect x="10" y="30" width="8" height="25" fill="#fff" stroke="none" rx="2"/>
    <rect x="22" y="15" width="8" height="40" fill="#66d9e8" stroke="none" rx="2"/>
    <rect x="34" y="22" width="8" height="33" fill="#fff" stroke="none" rx="2"/>
    <!-- Trend line -->
    <polyline points="44,35 52,28 60,20" stroke="#ffd43b" stroke-width="3" fill="none"/>
    <!-- Circles on trend -->
    <circle cx="44" cy="35" r="3" fill="#ffd43b" stroke="none"/>
    <circle cx="52" cy="28" r="3" fill="#ffd43b" stroke="none"/>
    <circle cx="60" cy="20" r="3" fill="#ffd43b" stroke="none"/>
  </g>
  <!-- KPI text -->
  <text x="35" y="62" font-family="Arial,sans-serif" font-size="10" fill="#fff"
        font-weight="bold" text-anchor="middle">KPI</text>
</svg>
